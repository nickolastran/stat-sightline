# Refreshes frontend/data/playoff-odds.json — the deployed site has no API, so
# /playoffs reads the odds from that snapshot. Rebuilds games.csv + model.pkl
# from scratch (they're gitignored; ~10s), then commits only if the odds moved,
# which triggers the Vercel redeploy.
name: Playoff odds

on:
  schedule:
    - cron: "0 12 * * *" # 8am ET, after last night's games are final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests python-dotenv
      - run: python scripts/train_standings.py
      - run: python scripts/snapshot_playoff_odds.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/playoff-odds.json
          git diff --cached --quiet || { git commit -m "chore: refresh playoff odds" && git push; }
